# Runs the Claude setup's own eval suite when the setup changes, and nightly.
# Each eval is a real past task with a scripted pass/fail check. Add one after every incident.
name: Agent evals
on:
  pull_request:
    paths:
      - "CLAUDE.md"
      - "**/CLAUDE.md"
      - ".claude/**"
      - ".mcp.json"
      - "REVIEW.md"
      - "evals/**"
  schedule:
    - cron: "17 2 * * *"
jobs:
  evals:
    # Gated off for the git simulation (no ANTHROPIC_API_KEY). Remove this line to re-enable.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Run evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bash evals/check.sh
